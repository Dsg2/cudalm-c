<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cudalm monitor</title>
<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fcfcfb;--line:#e4e3df;--grid:#ecebe7;--text:#0b0b0b;--text2:#52514e;--muted:#7a7974;
--s1:#2a78d6;--s1soft:#86b6ef;--good:#0ca30c;--warn:#b07800;--serious:#c4562b;--crit:#d03b3b;--track:#e4e3df}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#111110;--surface:#1a1a19;--line:#2e2e2c;--grid:#262624;
--text:#f0efec;--text2:#c3c2b7;--muted:#8f8e86;--s1:#3987e5;--s1soft:#1c5cab;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#e66767;--track:#2e2e2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
h1{font-size:18px;margin:0;font-weight:650}
h2{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--text2);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.run{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.run:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.run.sel{border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.rn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.st{font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;gap:4px;align-items:center;color:var(--text2)}
.st i{font-style:normal}
.st.good i{color:var(--good)}.st.warn i{color:var(--warn)}.st.serious i{color:var(--serious)}.st.crit i{color:var(--crit)}
.st.crit,.st.serious{color:var(--text)}
.bar{height:6px;background:var(--track);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.bar>div{height:100%;background:var(--s1);border-radius:3px}
.kv{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--text2)}
.kv b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tile .l{font-size:12px;color:var(--text2)}.tile .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.25}
.tile .n{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.two{grid-template-columns:1fr 1fr}}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 16px}
.tk{margin:16px 0 8px}.tk .sub{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}.tn{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text2)}.tn b{color:var(--text);font-variant-numeric:tabular-nums}
.ch .refl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{all:unset;cursor:pointer;font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--text2)}
.chip.on{border-color:var(--s1);color:var(--text);background:color-mix(in srgb,var(--s1) 12%,transparent)}
.chip:focus-visible{outline:2px solid var(--s1)}
.ch{position:relative;width:100%}
.ch svg{display:block;width:100%;overflow:visible}
.ch text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.ch .grid{stroke:var(--grid);stroke-width:1}
.ch .ln{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .raw{fill:none;stroke:var(--s1);stroke-opacity:.35;stroke-width:1;stroke-linejoin:round}
.ch .dot{fill:var(--s1soft);stroke:var(--surface);stroke-width:2}
.ch .dot.sm{stroke:none}
.ch .cross{stroke:var(--text2);stroke-width:1;stroke-dasharray:3 3}
.ch .hd{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;
white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;color:var(--text);font-variant-numeric:tabular-nums}
.leg{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:4px}
.leg span::before{content:"";display:inline-block;width:14px;height:2px;background:var(--s1);vertical-align:middle;margin-right:5px}
.leg span.r::before{height:1px;background:var(--s1);opacity:.5}
.leg span.d::before{width:8px;height:8px;border-radius:50%;background:var(--s1soft)}
pre{margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto;max-height:340px;white-space:pre;color:var(--text)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:3px 8px;border-bottom:1px solid var(--grid)}th{color:var(--text2);font-weight:600}
td:last-child,th:last-child{text-align:left}
details summary{cursor:pointer;color:var(--text2);font-size:12.5px;margin-top:8px}
.tw{overflow-x:auto}
.empty{color:var(--text2);padding:8px 0}
#tok{display:none}#tok input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:min(360px,100%)}
#tok button{font:inherit;padding:6px 12px;margin-left:6px;border-radius:6px;border:1px solid var(--s1);background:var(--s1);color:#fff;cursor:pointer}
.err{color:var(--crit)}
</style>
</head>
<body>
<main>
<header><h1>cudalm monitor</h1><span class="sub" id="host"></span><span class="sub" id="upd"></span></header>
<div class="card" id="tok"><h2>Token</h2><p class="sub">This monitor needs its access token (the --token-file on the PC).</p>
<form id="tf"><input id="ti" type="password" autocomplete="off" placeholder="token"><button>Save</button></form><p class="err" id="te"></p></div>
<div class="card sub" id="gpu">loading…</div>
<div class="runs" id="runs"></div>
<section id="det" hidden>
<div class="tiles" id="tiles"></div>
<div class="card"><div class="row"><h2 id="lt">Training loss</h2></div>
<div class="chips" id="lr"></div><div class="leg"><span class="r">mean per point</span><span>smoothed</span></div><div class="ch" id="lc"></div>
<details><summary>Loss data</summary><div class="tw" id="lta"></div></details></div>
<div class="card"><h2>Benchmarks</h2><div class="leg"><span class="d">bench</span><span>mean of last 4</span></div>
<div class="two"><div><div class="sub">Intelligence index (II)</div><div class="ch" id="bc1"></div></div>
<div><div class="sub">Margin index</div><div class="ch" id="bc2"></div></div></div>
<h2 class="tk">By task <span class="sub">accuracy %, dashed line = chance</span></h2><div class="tasks" id="tasks"></div>
<details><summary>Bench table</summary><div class="tw" id="bta"></div></details></div>
<div class="card"><h2>Log</h2><div class="sub" id="lp"></div><pre id="log"></pre></div>
</section>
<div class="card"><h2>Chains</h2><div class="chips" id="resl"></div><pre id="rest"></pre></div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id), E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tok="", sel=null, selRes=null, range=0.5, cache={};
try{tok=localStorage.getItem("cudalm_tok")||"";sel=localStorage.getItem("cudalm_sel");range=+(localStorage.getItem("cudalm_range")||0.5)}catch(e){}
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
async function api(p){const r=await fetch(p,{headers:tok?{Authorization:"Bearer "+tok}:{},cache:"no-store"});
  if(r.status==401){$("tok").style.display="block";$("gpu").textContent="Waiting for the token";$("te").textContent=tok?"That token was not accepted.":"";throw new Error("token")} if(!r.ok) throw new Error(p+" "+r.status); return r.json()}
$("tf").onsubmit=e=>{e.preventDefault();tok=$("ti").value.trim();store("cudalm_tok",tok);$("te").textContent="";$("tok").style.display="none";tick()};
const n0=v=>v==null?"–":Math.round(v).toLocaleString("en-US");
const it=v=>v==null?"–":v>=1e6?(v/1e6).toFixed(2)+"M":v>=1e4?Math.round(v/1e3)+"k":String(Math.round(v));
const f=(v,d)=>v==null||!isFinite(v)?"–":(+v).toFixed(d);
function dur(s){if(s==null||!isFinite(s))return"–";s=Math.round(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?d+"d "+h+"h":h?h+"h "+m+"m":m?m+"m":s+"s"}
const live=r=>["running","bench","starting","stopping","disk-wait"].includes(r.state);
const ago=s=>s==null?"":dur(s)+" ago";
const STATE={running:["good","●","running"],bench:["good","●","benchmarking"],starting:["warn","◐","starting"],stopping:["warn","◐","stopping"],
  "disk-wait":["serious","▲","disk full - waiting"],stalled:["serious","▲","stalled"],stale:["serious","▲","no recent output"],
  dead:["crit","✕","dead"],divstop:["crit","✕","diverged"],"nan-abort":["crit","✕","NaN abort"],paused:["","■","paused"],finished:["","✓","finished"]};
const badge=s=>{const t=STATE[s]||["","?",s];return `<span class="st ${t[0]}"><i aria-hidden="true">${t[1]}</i>${E(t[2])}</span>`};
function niceTicks(a,b,n){if(!(b>a)){b=a+1;}const span=b-a,step0=Math.pow(10,Math.floor(Math.log10(span/n))),e=span/n/step0,
  step=step0*(e>=5?10:e>=2?5:e>=1?2:1);const t=[];for(let v=Math.ceil(a/step)*step;v<=b+1e-9*span;v+=step)t.push(+v.toPrecision(12));return t}
/* line chart: one line series (+ optional dots); hover = crosshair + tooltip */
function chart(host,o){
  const W=host.clientWidth||320,H=o.h||190,L=46,R=12,T=8,B=24,pw=W-L-R,ph=H-T-B;
  const all=[...(o.line||[]),...(o.dots||[]),...(o.raw||[])];
  if(!all.length){host.innerHTML='<div class="empty">No data yet</div>';return}
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  if(o.raw&&o.raw.length>20){const v=o.raw.map(p=>p[1]).sort((a,b)=>a-b);y0=v[Math.floor(v.length*.01)];y1=v[Math.ceil(v.length*.99)-1];
    for(const p of o.line||[]){y1=Math.max(y1,p[1]);y0=Math.min(y0,p[1])}}
  if(o.ref!=null){y0=Math.min(y0,o.ref);y1=Math.max(y1,o.ref)}
  if(x1==x0)x1=x0+1; const pad=(y1-y0||Math.abs(y1)||1)*.06; y0-=pad;y1+=pad;
  const X=v=>L+(v-x0)/(x1-x0)*pw,Y=v=>T+(1-(Math.max(y0,Math.min(v,y1))-y0)/(y1-y0))*ph;
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${E(o.label)}">`;
  for(const v of niceTicks(y0,y1,4)){if(v<y0||v>y1)continue;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${o.yf(v)}</text>`}
  for(const v of niceTicks(x0,x1,W<420?3:5)){if(v<x0||v>x1)continue;s+=`<text x="${X(v)}" y="${H-6}" text-anchor="middle">${it(v)}</text>`}
  if(o.ref!=null)s+=`<line class="refl" x1="${L}" x2="${W-R}" y1="${Y(o.ref)}" y2="${Y(o.ref)}"/><text x="${W-R}" y="${Y(o.ref)-4}" text-anchor="end">chance</text>`;
  if(o.raw&&o.raw.length)s+=`<path class="raw" d="${path(o.raw)}"/>`;
  const dn=(o.dots||[]).length>30;   /* dense: small plain dots under the line */
  for(const p of o.dots||[])s+=`<circle class="dot${dn?" sm":""}" r="${dn?2.5:4}" cx="${X(p[0])}" cy="${Y(p[1])}"/>`;
  if(o.line&&o.line.length)s+=`<path class="ln" d="${path(o.line)}"/>`;
  s+=`<line class="cross" y1="${T}" y2="${T+ph}" visibility="hidden"/><circle class="hd" r="4.5" visibility="hidden"/><rect x="${L}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  host.innerHTML=s;
  const svg=host.querySelector("svg"),cr=svg.querySelector(".cross"),hd=svg.querySelector(".hd"),tip=host.querySelector(".tip"),pts=o.dots&&o.dots.length?o.dots:o.line;
  const move=ev=>{const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width;let b=0,bd=1e18;
    pts.forEach((p,i)=>{const d=Math.abs(X(p[0])-mx);if(d<bd){bd=d;b=i}});const p=pts[b],px=X(p[0]),py=Y(p[1]);
    cr.setAttribute("x1",px);cr.setAttribute("x2",px);cr.setAttribute("visibility","visible");hd.setAttribute("cx",px);hd.setAttribute("cy",py);hd.setAttribute("visibility","visible");
    tip.innerHTML=o.tip(p,b);tip.style.display="block";const tw=tip.offsetWidth,sx=px*r.width/W;
    tip.style.left=Math.max(0,Math.min(r.width-tw,sx-tw/2))+"px";tip.style.top=Math.max(0,py*r.height/H-46)+"px"};
  const out=()=>{cr.setAttribute("visibility","hidden");hd.setAttribute("visibility","hidden");tip.style.display="none"};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",out);
}
function runCard(r){const pct=r.iters?Math.max(0,Math.min(100,100*r.iter/r.iters)):0;
  return `<button class="run${r.name==sel?" sel":""}" data-n="${E(r.name)}" aria-pressed="${r.name==sel}"><div class="row"><span class="rn">${E(r.name)}</span>${badge(r.state)}</div>
  <div class="bar" role="progressbar" aria-valuenow="${pct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
  <div class="kv"><span><b>${it(r.iter)}</b> / ${it(r.iters)}</span><span>loss <b>${f(r.loss_ema,3)}</b></span>${live(r)&&r.tok_s?`<span><b>${it(r.tok_s)}</b> tok/s</span>`:""}
  ${r.eta_s!=null?`<span>ETA <b>${dur(r.eta_s)}</b></span>`:""}${r.bench?`<span>II <b>${f(r.bench.ii,2)}</b></span>`:""}<span>${ago(r.age_s)}</span></div></button>`}
function tiles(r){const t=(l,v,n)=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div>${n?`<div class="n">${n}</div>`:""}</div>`;
  const pct=r.iters?(100*r.iter/r.iters).toFixed(1)+"%":"";
  return t("State",badge(r.state),r.source=="status"?(r.exe||"")+(r.pid?" · pid "+r.pid:""):"from log")+t("Iteration",it(r.iter),pct+" of "+it(r.iters))
   +t("Loss (EMA)",f(r.loss_ema,3),"last "+f(r.loss,3))+t("Tokens/s",live(r)?n0(r.tok_s):"–",live(r)&&r.lr!=null?"lr "+(+r.lr).toExponential(2):"")
   +t("ETA",dur(r.eta_s),r.eta_s!=null?new Date(Date.now()+r.eta_s*1000).toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"}):"")
   +t("Last bench",r.bench?f(r.bench.ii,2):"–",r.bench?"II at "+it(r.bench.iter)+" · margin "+f(r.bench.margin,2):"")
   +t("Checkpoint",r.ckpt?it(r.ckpt):"–",r.updated?"updated "+ago(r.age_s):"")}
function drawLoss(){const d=cache.loss;if(!d)return;const p=d.points,k=Math.floor(p.length*(1-range));const v=p.slice(range>=1?0:k).map(q=>[q[0],q[1]]),w=Math.max(2,Math.round(v.length/40));
  const sm=v.map((q,i)=>{let a=0,c=0;for(let j=Math.max(0,i-w);j<=Math.min(v.length-1,i+w);j++){a+=v[j][1];c++}return[q[0],a/c]});
  chart($("lc"),{raw:v,line:sm,label:"Training loss by iteration",yf:y=>y.toFixed(2),tip:(q,i)=>`iter <b>${n0(q[0])}</b> · smoothed <b>${q[1].toFixed(3)}</b> · point ${v[i][1].toFixed(3)}`});
  $("lta").innerHTML=`<table><tr><th>iter</th><th>mean loss</th><th>min loss</th><th>lr</th><th>tok/s</th></tr>`+p.slice(-60).reverse().map(q=>`<tr><td>${n0(q[0])}</td><td>${q[1].toFixed(4)}</td><td>${q[2].toFixed(4)}</td><td>${(+q[3]).toExponential(2)}</td><td>${n0(q[4])}</td></tr>`).join("")+"</table>"}
function drawBench(){const rows=(cache.bench||{}).rows||[];const mk=k=>{const d=rows.filter(r=>r[k]!=null).map(r=>[r.iter,r[k]]);const m=d.map((p,i)=>{const w=d.slice(Math.max(0,i-3),i+1);return[p[0],w.reduce((a,b)=>a+b[1],0)/w.length]});return[d,m]};
  const[d1,m1]=mk("ii"),[d2,m2]=mk("margin");
  chart($("bc1"),{dots:d1,line:m1,h:170,label:"Intelligence index by iteration",yf:y=>y.toFixed(1),tip:(q,i)=>`iter <b>${n0(q[0])}</b> · II <b>${q[1].toFixed(2)}</b> · mean4 ${m1[i][1].toFixed(2)}`});
  chart($("bc2"),{dots:d2,line:m2,h:170,label:"Margin index by iteration",yf:y=>y.toFixed(1),tip:(q,i)=>`iter <b>${n0(q[0])}</b> · margin <b>${q[1].toFixed(3)}</b> · mean4 ${m2[i][1].toFixed(3)}`});
  /* per task: "hellaswag 27.95  arc_easy 35.86 ..." in each row's scores */
  const sc=rows.map(r=>{const o={};for(const m of (r.scores||"").matchAll(/([A-Za-z][\w-]*)\s+(-?\d+(?:\.\d+)?)/g))o[m[1]]=+m[2];return o});
  const names=[];sc.forEach(o=>Object.keys(o).forEach(k=>{if(!names.includes(k))names.push(k)}));
  $("tasks").innerHTML=names.map((k,j)=>`<div><div class="tn"><span>${E(TASK[k]?TASK[k][0]:k)}</span><span id="tv${j}"></span></div><div class="ch" id="tc${j}"></div></div>`).join("")||'<div class="empty">No per-task scores yet</div>';
  names.forEach((k,j)=>{const d=rows.map((r,i)=>[r.iter,sc[i][k]]).filter(p=>p[1]!=null),m=mean4(d),last=d[d.length-1],ch=TASK[k]?TASK[k][1]:null;
    $("tv"+j).innerHTML=last?`<b>${last[1].toFixed(1)}%</b> · mean4 ${m[m.length-1][1].toFixed(1)}${ch!=null?" · chance "+ch:""}`:"";
    chart($("tc"+j),{dots:d,line:m,ref:ch,h:150,label:(TASK[k]?TASK[k][0]:k)+" accuracy by iteration",yf:y=>y.toFixed(0),
      tip:(q,i)=>`iter <b>${n0(q[0])}</b> · <b>${q[1].toFixed(2)}%</b> · mean4 ${m[i][1].toFixed(2)}`})});
  $("bta").innerHTML=rows.length?`<table><tr><th>iter</th><th>II</th><th>margin</th>${names.map(k=>`<th>${E(TASK[k]?TASK[k][0]:k)}</th>`).join("")}</tr>`
    +rows.map((r,i)=>`<tr><td>${n0(r.iter)}</td><td>${f(r.ii,2)}</td><td>${f(r.margin,3)}</td>${names.map(k=>`<td>${f(sc[i][k],2)}</td>`).join("")}</tr>`).reverse().join("")+"</table>":'<div class="empty">No benches yet</div>'}
const TASK={hellaswag:["HellaSwag",25],arc_easy:["ARC-Easy",25],arc_challenge:["ARC-Challenge",25],piqa:["PIQA",50],lambada:["LAMBADA",0],arithmark:["ArithMark",25],
  winogrande:["WinoGrande",50],openbookqa:["OpenBookQA",25],boolq:["BoolQ",50],mmlu:["MMLU",25]};
const mean4=d=>d.map((p,i)=>{const w=d.slice(Math.max(0,i-3),i+1);return[p[0],w.reduce((a,b)=>a+b[1],0)/w.length]});
$("lr").innerHTML=[[1,"All"],[0.5,"Last half"],[0.1,"Last 10%"]].map(([v,l])=>`<button class="chip" data-r="${v}" aria-pressed="false">${l}</button>`).join("");
$("lr").onclick=e=>{const b=e.target.closest("button");if(!b)return;range=+b.dataset.r;store("cudalm_range",range);mark();drawLoss();tick()};
const mark=()=>$("lr").querySelectorAll("button").forEach(b=>{const on=+b.dataset.r==range;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});mark();
$("runs").onclick=e=>{const b=e.target.closest(".run");if(!b)return;sel=b.dataset.n;store("cudalm_sel",sel);cache={};tick()};
$("resl").onclick=e=>{const b=e.target.closest("button");if(!b)return;selRes=b.dataset.n;tick()};
let busy=false;
async function tick(){if(busy)return;busy=true;try{
  const [runs,sys,res]=await Promise.all([api("/api/runs"),api("/api/sys"),api("/api/res")]);
  const g=(sys.gpus||[])[0];$("gpu").innerHTML=g?`<b>${E(g.name)}</b> · ${g.util}% busy · ${f(g.mem_used_mb/1024,1)} / ${f(g.mem_total_mb/1024,1)} GB · ${g.temp_c} °C · ${f(g.power_w,0)} W`+(g.fan!=null?` · fan ${g.fan}%`:"")+(sys.disk_free_gb!=null?` · disk ${f(sys.disk_free_gb,0)} GB free`:""):"No NVIDIA GPU visible"+(sys.disk_free_gb!=null?` · disk ${f(sys.disk_free_gb,0)} GB free`:"");
  $("upd").textContent="updated "+new Date().toLocaleTimeString("en-GB");
  const R=runs.runs||[];if(!R.find(r=>r.name==sel))sel=((R.find(live)||R[0])||{}).name||null;
  $("runs").innerHTML=R.length?R.map(runCard).join(""):'<div class="card empty">No runs in the last 14 days</div>';
  const rs=(res.res||[]).sort((a,b)=>a.age_s-b.age_s).slice(0,8);if(!rs.find(r=>r.name==selRes))selRes=rs.length?rs[0].name:null;
  $("resl").innerHTML=rs.map(r=>`<button class="chip${r.name==selRes?" on":""}" data-n="${E(r.name)}" aria-pressed="${r.name==selRes}">${E(r.name)} <span class="sub">${dur(r.age_s)}</span></button>`).join("")||'<span class="empty">No .res files</span>';
  if(selRes){const t=await api("/api/res/"+encodeURIComponent(selRes)+"?tail=30");const q=$("rest");q.textContent=(t.lines||[]).join("\n");q.scrollTop=q.scrollHeight}
  if(sel){const n=encodeURIComponent(sel);const[r,l,b,lg]=await Promise.all([api("/api/run/"+n),api("/api/loss/"+n+"?pts="+Math.round(Math.max(150,Math.min(4000,($("lc").clientWidth||600)/(range>=1?1.5:range>=.5?.75:.15))))),api("/api/bench/"+n),api("/api/log/"+n+"?tail=60")]);
    cache={loss:l,bench:b};$("det").hidden=false;$("tiles").innerHTML=tiles(r);$("lt").textContent="Training loss · "+sel;
    document.title=`${(STATE[r.state]||[,,r.state])[2]} · ${sel} · cudalm`;drawLoss();drawBench();
    $("lp").textContent=lg.log||"no log";const pre=$("log"),end=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-8;pre.textContent=(lg.lines||[]).join("\n");if(end)pre.scrollTop=pre.scrollHeight}
  else $("det").hidden=true;
}catch(e){if(e.message!="token")$("upd").innerHTML=`<span class="err">${E(e.message)}</span>`}finally{busy=false}}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{drawLoss();drawBench()},150)});
tick();setInterval(tick,15000);
</script>
</body>
</html>
