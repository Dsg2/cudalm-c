name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VER: 12.9.1

jobs:
  cpu:
    name: cpu (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@v2
        with: { msystem: MINGW64, install: mingw-w64-x86_64-gcc, update: false, suppress-deprecation-warnings: msystem-mingw64 }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ steps.msys.outputs.msys2-location }}\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH'
      - name: build
        shell: pwsh
        run: |
          python build.py --cpu --cpu-arch haswell 2>&1 | Tee-Object build.txt
          if ($LASTEXITCODE) {
            Get-Content build.txt | ? { $_ -notmatch '^\s+\d*\s*\||note:|warning:|In function|In member' } | Select-Object -Last 25 | % { "::error::$_" }
            exit 1
          }
      - name: selftest
        shell: bash
        run: |
          ./cudalm_cpu selftest | tee selftest.txt
          grep -q "ALL PASS" selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cudalm-cpu-${{ runner.os }}
          path: cudalm_cpu*

  gpu:
    name: gpu sm_${{ matrix.arch }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        arch: ['75', '86', '89', '120']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: .deps/cuda-${{ env.CUDA_VER }}
          key: cuda-${{ runner.os }}-${{ env.CUDA_VER }}
      - name: build
        shell: bash
        run: |
          set -o pipefail
          python build.py --download-cuda --cuda-version ${{ env.CUDA_VER }} --arch ${{ matrix.arch }} --out cudalm_sm${{ matrix.arch }} 2>&1 | tee build.txt || { grep -vE "^ +[0-9]* *[|]|note:|warning:|In function|In member" build.txt | tail -n 25 | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cudalm-gpu-${{ runner.os }}-sm${{ matrix.arch }}
          path: |
            cudalm_sm${{ matrix.arch }}
            cudalm_sm${{ matrix.arch }}.exe
      - if: runner.os == 'Windows' && matrix.arch == '120'
        uses: actions/upload-artifact@v4
        with:
          name: cublas-dlls-Windows
          path: '*.dll'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cpu, gpu]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" *.zip -R "$GITHUB_REPOSITORY" --clobber
